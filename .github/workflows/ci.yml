name: CI

on:
  push:
  pull_request:

jobs:
  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run macOS core checks
        run: swift run HanYiCoreChecks
      - name: Build macOS app
        run: Scripts/build-app.sh

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Windows core checks
        run: dotnet run --project Windows/HanYi.CoreChecks/HanYi.CoreChecks.csproj -c Release
      - name: Build Windows app
        run: dotnet build Windows/HanYi.Windows/HanYi.Windows.csproj -c Release
