# Rime dictionary for KEYI's mixed English input.
# encoding: utf-8
#
# english/scowl: common English words from SCOWL (LICENSE.scowl), generated by
# IME/Scripts/generate-english-dict.py. english/en_ext: abbreviations and
# technical terms from 雾凇拼音 (rime-ice, GPL-3.0, same pinned commit as the
# Chinese tables). en_ext comes first so its capitalisation (GitHub, JSON) wins.
# english/hint: the same words under the first letters typed (wo → would, work),
# ranked by wordfreq (LICENSE.wordfreq.md), generated by
# IME/Scripts/generate-english-hints.py.

---
name: keyi_english
version: "1.1"
sort: by_weight
import_tables:
  - english/en_ext
  - english/scowl
  - english/hint
...
